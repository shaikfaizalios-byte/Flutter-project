# Debug APK for side-loading on a test phone. The API address is baked in at build time.
#
#   git push origin HEAD:test-apk/192.168.1.25      -> API_BASE_URL=http://192.168.1.25:8000
#
# The APK is attached to the "test-apk" pre-release (replaced on every run) so it can be
# downloaded on the phone without signing in. It is a debug build (debug key, cleartext HTTP
# allowed, development flavor): never distribute it as a release.
name: Test APK

on:
  push:
    branches: ["test-apk/*"]
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "API base URL the phone can reach, e.g. http://192.168.1.25:8000"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - name: Resolve API address
        id: api
        env:
          INPUT_URL: ${{ inputs.api_base_url }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -n "$INPUT_URL" ]; then url="$INPUT_URL"; else url="http://${REF_NAME#test-apk/}:8000"; fi
          if ! printf '%s' "$url" | grep -Eq '^https?://[A-Za-z0-9.-]+(:[0-9]+)?$'; then
            echo "::error::Invalid API address: $url"; exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.7"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: >
          flutter build apk --debug
          --dart-define=FLAVOR=development
          --dart-define=API_BASE_URL=${{ steps.api.outputs.url }}
          --dart-define=APP_NAME="PrepLoop (test)"
      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ steps.api.outputs.url }}
        run: |
          cp build/app/outputs/flutter-apk/app-debug.apk preploop-test.apk
          gh release delete test-apk --yes --cleanup-tag || true
          gh release create test-apk preploop-test.apk --prerelease --target "$GITHUB_SHA" \
            --title "Test APK (debug, not for distribution)" \
            --notes "Debug build of $GITHUB_SHA for side-loading. API: $API_URL"
