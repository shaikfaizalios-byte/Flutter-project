[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "preploop-api"
version = "0.1.0"
description = "PrepLoop backend API (FastAPI modular monolith)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.143,<1.0",
    "uvicorn[standard]>=0.54,<1.0",
    "pydantic>=2.14,<3.0",
    "pydantic-settings>=2.15,<3.0",
    "sqlalchemy>=2.1,<2.2",
    "alembic>=1.20,<2.0",
    # PostgreSQL driver (LGPL-3.0; server-side use only, not redistributed).
    "psycopg[binary]>=3.3,<4.0",
    # PDF text extraction + page rendering via PDFium (Apache-2.0/BSD-3; chosen over
    # AGPL-licensed PyMuPDF, see docs/architecture.md ADR-23).
    "pypdfium2>=5.14,<6.0",
    # Page images for OCR (MIT-CMU).
    "pillow>=12.3,<13.0",
    # multipart/form-data parsing for uploads (Apache-2.0).
    "python-multipart>=0.0.32,<0.1",
    # IANA timezone data for zoneinfo on Windows (Apache-2.0; already locked via psycopg).
    "tzdata>=2026.1",
    # Optional AI assistance via Anthropic Claude (MIT). Off unless PREPLOOP_AI_API_KEY is set.
    "anthropic>=1.13,<2.0",
    # Accounts: Argon2id password hashing (MIT) and signed access tokens (MIT).
    "argon2-cffi>=25.1,<26.0",
    "PyJWT>=2.15,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1,<10",
    # Starlette TestClient transport. Starlette 1.7 suggests httpx2; evaluate before switching.
    "httpx>=0.28,<1.0",
    "ruff>=0.17,<1.0",
    "mypy>=2.4,<3.0",
    # Generates synthetic PDFs in tests (BSD).
    "reportlab>=5.0,<6.0",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "N", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Tests use throwaway secrets and passwords on purpose.
"tests/**" = ["S101", "S105", "S106"]
# Score explanations are user-facing text and use the real × and − signs.
"app/domain/scoring.py" = ["RUF001", "RUF002"]
"tests/test_scoring.py" = ["RUF001"]
"tests/test_practice.py" = ["RUF001"]
"tests/test_ai.py" = ["RUF001"]
"tests/test_ai_content.py" = ["RUF001"]
"tests/test_sync.py" = ["RUF001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Neither ships type information; their APIs are wrapped in typed functions here.
module = ["pypdfium2", "pypdfium2.*", "reportlab", "reportlab.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
