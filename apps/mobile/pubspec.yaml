name: preploop
description: "PrepLoop - personalised SSC CGL / CHSL exam preparation."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  dio: ^5.11.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_timezone: ^5.1.1
  go_router: ^18.0.2
  intl: ^0.20.3
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  # Generates AppLocalizations from lib/core/localization/arb (see l10n.yaml).
  generate: true

  assets:
    # Licence text for the bundled font (registered in bootstrap.dart).
    - assets/fonts/noto_sans_devanagari/OFL.txt
    - assets/fonts/roboto/LICENSE.txt
    # Privacy policy and terms (drafts), shown in the app.
    - assets/legal/

  fonts:
    # Roboto (Apache 2.0), copied from the Flutter SDK's material_fonts. Bundled so the web app
    # never downloads fonts from Google's servers (that would send every visitor's IP to Google).
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/roboto-regular.ttf
        - asset: assets/fonts/roboto/roboto-medium.ttf
          weight: 500
        - asset: assets/fonts/roboto/roboto-bold.ttf
          weight: 700
    # Noto Sans Devanagari v2.007 (SIL OFL 1.1), from github.com/notofonts/devanagari.
    # Used as a fallback so Hindi renders offline everywhere, including web.
    - family: NotoSansDevanagari
      fonts:
        - asset: assets/fonts/noto_sans_devanagari/NotoSansDevanagari-Regular.ttf
        - asset: assets/fonts/noto_sans_devanagari/NotoSansDevanagari-Bold.ttf
          weight: 700
