include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 100

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - prefer_const_constructors
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures

analyzer:
  language:
    strict-casts: true
    strict-raw-types: true
  exclude:
    - lib/core/localization/generated/**
    - build/**
    - android/**
    - ios/**
    - web/**
