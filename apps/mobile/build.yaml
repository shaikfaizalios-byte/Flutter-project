targets:
  $default:
    builders:
      drift_dev:
        options:
          # ISO-8601 text keeps timezone information and is readable in SQLite tools.
          store_date_time_values_as_text: true
          # Used by `dart run drift_dev make-migrations` (schema snapshots + migration tests).
          databases:
            app_database: lib/core/database/app_database.dart
          schema_dir: drift_schemas/
          test_dir: test/drift/
